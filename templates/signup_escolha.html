{% extends "base.html" %}

{% block title %}Criar Conta - DataTâme{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="text-center p-5 rounded-4 shadow-sm" style="background: #f8f9fa; max-width: 450px; width: 100%;">
        <h2 class="mb-4 fw-bold text-dark">Escolha o tipo de cadastro</h2>

        <div class="d-grid gap-3">
            <a href="/signup_atleta/" class="btn btn-primary btn-lg fw-semibold" 
               style="border-radius: 12px; padding: 12px 0; transition: 0.2s;">
                Cadastro Atleta
            </a>
            <a href="/signup_equipe/" class="btn btn-outline-secondary btn-lg fw-semibold" 
               style="border-radius: 12px; padding: 12px 0; transition: 0.2s;">
                Cadastro Equipe
            </a>
        </div>
    </div>
</div>

<style>
    a.btn-primary:hover {
        background-color: #0b5ed7;
        transform: translateY(-2px);
    }
    a.btn-outline-secondary:hover {
        background-color: #e9ecef;
        transform: translateY(-2px);
    }
</style>
{% endblock %}
